name: Publish release container

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bind release tag, package, and immutable source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"AMB_VERSION={version}\n")
          PY
      - name: Install candidate validation tools
        run: python -m pip install '.[dev]'
      - name: Build candidate image from release source
        run: >
          docker build --build-arg "AMB_VERSION=$AMB_VERSION"
          --build-arg "VCS_REF=$GITHUB_SHA"
          --tag "ghcr.io/zzhang82/agent-memory-bridge:$AMB_VERSION" .
      - name: Verify image provenance and persistence
        run: >
          python scripts/check_container_deployment.py
          --image "ghcr.io/zzhang82/agent-memory-bridge:$AMB_VERSION"
          --expected-version "$AMB_VERSION" --expected-revision "$GITHUB_SHA"
          --runtime-dir "$RUNNER_TEMP/amb-container-acceptance"
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the validated versioned image
        run: docker push "ghcr.io/zzhang82/agent-memory-bridge:$AMB_VERSION"
